services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ahorro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ahorro}
      POSTGRES_DB: ${POSTGRES_DB:-ahorrommvd}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ahorro}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ahorro}:${POSTGRES_PASSWORD:-ahorro}@postgres:5432/${POSTGRES_DB:-ahorrommvd}?schema=public
      PORT: 3900
    ports:
      - "3900:3900"
    volumes:
      - .:/app
      - /app/node_modules
    command: npm run start:dev

volumes:
  pgdata:
